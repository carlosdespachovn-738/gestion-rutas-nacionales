<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red Vial Nacional — 40.332 km</title>
<style>
:root {
  --bg: #0d1520; --bg2: #111d2e; --bg3: #16273d; --bg4: #1c3050;
  --borde: #243650; --borde2: #2e4468;
  --txt: #c8d8ee; --txt2: #7a9bbf; --txt3: #4a6880;
  --azul: #2a7dd4; --azul2: #3b9aef; --azul3: #6bbeff;
  --verde: #1d9e52; --verde2: #26c466; --verde3: #7ef5b0;
  --lila: #7040c8; --lila2: #9060e8; --lila3: #c4a0ff;
  --naranja: #c06020; --naranja2: #e87830; --naranja3: #ffc080;
  --rojo: #c02030; --rojo2: #e04050; --rojo3: #ff8090;
  --amarillo: #c89010; --amarillo2: #f0b020; --amarillo3: #ffe060;
  --gris: #506070;
  --sombra: 0 4px 20px rgba(0,0,0,.4);
  --radio: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI',system-ui,sans-serif; background: var(--bg); color: var(--txt); font-size: 12px; min-height: 100vh; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--borde2); border-radius: 3px; }

/* ─── HEADER ─── */
header {
  background: linear-gradient(135deg, #080f18 0%, #0d1a2a 50%, #101e30 100%);
  border-bottom: 1px solid var(--borde2);
  padding: 0 20px;
  display: flex; align-items: stretch; gap: 0;
  min-height: 58px;
  position: sticky; top: 0; z-index: 200;
  box-shadow: 0 2px 20px rgba(0,0,0,.5);
}
.hbrand { display:flex; align-items:center; gap:10px; padding:10px 20px 10px 0; border-right:1px solid var(--borde2); min-width:220px; }
.hbrand-ico { font-size:26px; }
.hbrand h1 { font-size:13px; font-weight:800; color:#fff; letter-spacing:-.2px; }
.hbrand p { font-size:9px; color:var(--txt2); margin-top:2px; letter-spacing:.3px; }
.hkpis { display:flex; align-items:stretch; flex:1; overflow-x:auto; }
.hkpi { padding:0 18px; display:flex; flex-direction:column; justify-content:center; border-right:1px solid var(--borde); cursor:default; }
.hkpi:hover { background: rgba(255,255,255,.03); }
.hkpi .v { font-size:17px; font-weight:900; letter-spacing:-.5px; }
.hkpi .l { font-size:8px; color:var(--txt2); text-transform:uppercase; letter-spacing:.6px; margin-top:2px; }
.hkpi.total .v { color:#fff; }
.hkpi.conc .v { color:var(--azul3); }
.hkpi.admin .v { color:var(--verde3); }
.hkpi.conv .v { color:var(--lila3); }
.hkpi.obras .v { color:var(--amarillo3); }
.hkpi.provs .v { color:var(--naranja3); }

/* ─── BARRA CONTROLES ─── */
.ctrl-bar {
  background: var(--bg2); border-bottom: 1px solid var(--borde);
  padding: 7px 16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  position: sticky; top: 58px; z-index: 190;
}
.tabs { display:flex; background:var(--bg3); border-radius:6px; padding:2px; gap:1px; }
.tab { background:none; border:none; color:var(--txt2); padding:4px 12px; font-size:10px; font-weight:700; border-radius:4px; cursor:pointer; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; }
.tab.on { background:var(--azul); color:#fff; }
.tab:hover:not(.on) { background:var(--bg4); color:var(--txt); }
.sep { width:1px; height:22px; background:var(--borde); flex-shrink:0; }
.ctrl-group { display:flex; align-items:center; gap:5px; }
.ctrl-group label { font-size:9px; font-weight:700; color:var(--txt2); white-space:nowrap; text-transform:uppercase; letter-spacing:.5px; }
select, input[type=text] {
  background:var(--bg3); border:1px solid var(--borde2); border-radius:4px;
  color:var(--txt); padding:4px 7px; font-size:10px; outline:none; cursor:pointer;
}
select:focus, input:focus { border-color:var(--azul); box-shadow:0 0 0 2px rgba(42,125,212,.2); }
.btn { background:var(--bg3); border:1px solid var(--borde2); color:var(--txt2); border-radius:4px; padding:4px 10px; font-size:9px; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:.4px; white-space:nowrap; }
.btn:hover { background:var(--bg4); color:var(--txt); border-color:var(--azul); }
.leyenda { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-left:auto; }
.ley { display:flex; align-items:center; gap:4px; font-size:9px; color:var(--txt2); }
.ley-sq { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
.ley-gap { width:12px; height:9px; border:1px dashed var(--rojo2); background:repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(200,30,45,.3) 2px,rgba(200,30,45,.3) 4px); border-radius:1px; }

/* ─── MAIN ─── */
main { padding:12px 16px; display:flex; flex-direction:column; gap:10px; }

/* ─── PANEL RUTA ─── */
.rp { background:var(--bg2); border:1px solid var(--borde); border-radius:var(--radio); overflow:hidden; }
.rp-head {
  background: linear-gradient(90deg, var(--bg3) 0%, var(--bg4) 100%);
  border-bottom: 1px solid var(--borde);
  padding: 8px 14px; display:flex; align-items:center; gap:10px;
  cursor:pointer; user-select:none;
  transition: background .15s;
}
.rp-head:hover { background: linear-gradient(90deg,var(--bg4) 0%,#203550 100%); }
.rp-num { font-size:15px; font-weight:900; color:#fff; min-width:70px; letter-spacing:-.5px; }
.rp-tag { font-size:8px; color:var(--txt3); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
.rp-km { font-size:13px; font-weight:800; color:var(--txt); }
.rp-stats { display:flex; gap:12px; flex-wrap:wrap; }
.rst { display:flex; flex-direction:column; }
.rst .v { font-size:11px; font-weight:700; }
.rst .l { font-size:8px; color:var(--txt3); }
.prov-tags { display:flex; gap:4px; flex-wrap:wrap; margin-left:auto; }
.ptag { border-radius:10px; padding:2px 8px; font-size:8px; font-weight:700; color:rgba(255,255,255,.9); white-space:nowrap; }
.chev { color:var(--txt3); font-size:10px; flex-shrink:0; transition:transform .2s; margin-left:4px; }
.chev.cl { transform:rotate(-90deg); }

/* ─── CUERPO PANEL ─── */
.rp-body { padding:12px 14px 10px; display:flex; flex-direction:column; gap:8px; }
.rp-body.hdn { display:none; }

/* ─── BARRA PROVINCIA ─── */
.bar-prov { position:relative; height:7px; border-radius:2px; overflow:visible; }
.bp-seg { position:absolute; height:100%; border-radius:1px; overflow:hidden; }
.bp-seg span { font-size:6px; color:rgba(255,255,255,.8); font-weight:700; white-space:nowrap; padding:0 2px; display:block; margin-top:1px; overflow:hidden; text-overflow:ellipsis; }

/* ─── BARRA PRINCIPAL KM ─── */
.bar-wrap { display:flex; flex-direction:column; gap:2px; }
.bar-lbl-row { display:flex; justify-content:space-between; font-size:8px; color:var(--txt3); padding:0 1px; }
.bar-main {
  position:relative; height:26px;
  background:var(--bg3); border-radius:3px;
  border:1px solid var(--borde); overflow:visible;
  margin:16px 0 16px;
}
/* ticks */
.tick { position:absolute; top:0; bottom:0; border-left:1px dashed rgba(255,255,255,.07); pointer-events:none; }
.tick-l { position:absolute; top:100%; margin-top:3px; font-size:7px; color:var(--txt3); transform:translateX(-50%); white-space:nowrap; }
/* segmentos */
.seg { position:absolute; height:100%; border-radius:2px; cursor:pointer; transition:filter .12s,box-shadow .12s; min-width:2px; }
.seg:hover { filter:brightness(1.3); box-shadow:0 0 0 2px rgba(255,255,255,.3),0 2px 10px rgba(0,0,0,.5); z-index:10; }
.seg.conc { background: linear-gradient(180deg,#3a8fe0,#1e6db5); }
.seg.admin { background: linear-gradient(180deg,#28b85c,#1a8040); }
.seg.conv { background: linear-gradient(180deg,#8550e0,#5c30a8); }
.seg.transf { background: linear-gradient(180deg,#e07830,#a85020); }
/* obra pins */
.obra-pin {
  position:absolute; bottom:100%; margin-bottom:2px;
  width:6px; height:6px; border-radius:50%;
  transform:translateX(-50%); cursor:pointer;
  z-index:15; transition:transform .1s, box-shadow .1s;
  border:1px solid rgba(255,255,255,.3);
}
.obra-pin:hover { transform:translateX(-50%) scale(1.8); box-shadow:0 0 6px currentColor; }
.obra-pin.ejec { background:var(--verde2); }
.obra-pin.final { background:var(--gris); }
.obra-pin.paral { background:var(--amarillo2); }
.obra-pin.resc { background:var(--rojo2); }
.obra-pin.proye { background:var(--azul2); }
.obra-pin.otras { background:var(--txt3); }
/* gaps */
.gap-bar { position:absolute; height:100%; pointer-events:none; z-index:5;
  background:repeating-linear-gradient(90deg,transparent 0,transparent 2px,rgba(200,30,45,.25) 2px,rgba(200,30,45,.25) 4px);
  border-left:1px dashed rgba(200,30,45,.5); border-right:1px dashed rgba(200,30,45,.5);
}
.gap-lbl { position:absolute; bottom:100%; margin-bottom:2px; font-size:7px; color:var(--rojo2); font-weight:700; transform:translateX(-50%); white-space:nowrap; background:var(--bg2); padding:0 2px; border-radius:2px; z-index:6; }

/* ─── LEYENDA PROV RUTA ─── */
.pleg-row { display:flex; gap:8px; flex-wrap:wrap; }
.pleg-i { display:flex; align-items:center; gap:3px; font-size:8px; color:var(--txt2); }
.pleg-dot { width:7px; height:7px; border-radius:1px; flex-shrink:0; }

/* ─── OBRAS BADGE ─── */
.obras-mini { display:flex; gap:4px; flex-wrap:wrap; margin-top:2px; }
.ob-badge {
  display:inline-flex; align-items:center; gap:4px;
  background:var(--bg3); border:1px solid var(--borde2);
  border-radius:10px; padding:2px 8px; font-size:9px; color:var(--txt2);
  cursor:pointer; transition:border-color .1s,color .1s;
}
.ob-badge:hover { border-color:var(--azul); color:var(--azul2); }
.ob-badge .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.ob-badge.ejec .dot { background:var(--verde2); }
.ob-badge.final .dot { background:var(--gris); }
.ob-badge.paral .dot { background:var(--amarillo2); }
.ob-badge.resc .dot { background:var(--rojo2); }
.ob-badge.proye .dot { background:var(--azul2); }
.ob-badge.otras .dot { background:var(--txt3); }

/* ─── TABLA DETALLE ─── */
.tbl-tog { color:var(--azul2); cursor:pointer; font-size:9px; font-weight:700; display:inline-flex; align-items:center; gap:4px; padding:3px 0; user-select:none; }
.tbl-tog:hover { color:var(--azul3); }
.tbl-wrap { overflow-x:auto; max-height:320px; overflow-y:auto; margin-top:5px; }
.tbl { width:100%; border-collapse:collapse; font-size:10px; white-space:nowrap; }
.tbl th { background:var(--bg4); color:var(--txt2); padding:4px 8px; text-align:left; font-size:8px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; position:sticky; top:0; z-index:2; border-bottom:1px solid var(--borde2); }
.tbl td { padding:3px 8px; border-bottom:1px solid var(--borde); color:var(--txt); }
.tbl tr:hover td { background:var(--bg3); }
.tbl tr.conc td:first-child { border-left:3px solid var(--azul); }
.tbl tr.admin td:first-child { border-left:3px solid var(--verde); }
.tbl tr.conv td:first-child { border-left:3px solid var(--lila); }
.tbl tr.transf td:first-child { border-left:3px solid var(--naranja); }
.chip { display:inline-block; border-radius:3px; padding:1px 6px; font-size:8px; font-weight:700; }
.chip.conc { background:rgba(42,125,212,.2); color:var(--azul3); border:1px solid rgba(42,125,212,.3); }
.chip.admin { background:rgba(29,158,82,.2); color:var(--verde3); border:1px solid rgba(29,158,82,.3); }
.chip.conv { background:rgba(112,64,200,.2); color:var(--lila3); border:1px solid rgba(112,64,200,.3); }
.chip.transf { background:rgba(192,96,32,.2); color:var(--naranja3); border:1px solid rgba(192,96,32,.3); }

/* ─── VISTA PROVINCIA ─── */
.prov-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; }
.prov-card { background:var(--bg2); border:1px solid var(--borde); border-radius:var(--radio); overflow:hidden; }
.prov-card-head { padding:10px 14px; border-bottom:1px solid var(--borde); display:flex; align-items:center; gap:10px; }
.prov-dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
.prov-card-head h3 { font-size:13px; font-weight:800; color:#fff; flex:1; }
.prov-card-head .pkm { font-size:16px; font-weight:900; }
.prov-bars { padding:10px 14px; display:flex; flex-direction:column; gap:5px; }
.pb-row { display:flex; align-items:center; gap:6px; }
.pb-lbl { font-size:9px; color:var(--txt2); min-width:100px; font-weight:600; }
.pb-track { flex:1; height:10px; background:var(--bg3); border-radius:2px; overflow:hidden; border:1px solid var(--borde); }
.pb-fill { height:100%; border-radius:2px; }
.pb-val { font-size:9px; font-weight:700; min-width:80px; text-align:right; }
.prov-rn { padding:8px 14px; display:flex; flex-wrap:wrap; gap:4px; border-top:1px solid var(--borde); }
.rn-chip { background:var(--bg3); border:1px solid var(--borde2); border-radius:4px; padding:2px 7px; font-size:9px; font-weight:700; color:var(--txt); }
.prov-obras { padding:6px 14px 10px; border-top:1px solid var(--borde); }
.prov-obras p { font-size:8px; color:var(--txt2); margin-bottom:4px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }

/* ─── VISTA OBRAS ─── */
.obras-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:8px; }
.obra-card { background:var(--bg2); border:1px solid var(--borde); border-radius:var(--radio); padding:10px 12px; display:flex; flex-direction:column; gap:5px; }
.obra-card:hover { border-color:var(--borde2); background:var(--bg3); }
.oc-head { display:flex; align-items:flex-start; gap:8px; }
.oc-estado { display:flex; align-items:center; gap:5px; }
.oc-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.oc-lbl { font-size:8px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
.oc-rn { font-size:11px; font-weight:800; color:var(--azul2); }
.oc-nombre { font-size:10px; font-weight:700; color:var(--txt); line-height:1.3; }
.oc-tramo { font-size:9px; color:var(--txt2); }
.oc-km { font-size:10px; font-weight:700; color:var(--txt); }
.oc-tipo { font-size:8px; color:var(--txt3); }
.oc-avance { display:flex; align-items:center; gap:6px; }
.oc-av-track { flex:1; height:6px; background:var(--bg3); border-radius:3px; overflow:hidden; border:1px solid var(--borde); }
.oc-av-fill { height:100%; border-radius:3px; }
.oc-av-val { font-size:9px; font-weight:700; min-width:30px; text-align:right; }
.oc-dist { font-size:8px; color:var(--txt3); }
.oc-cont { font-size:8px; color:var(--txt2); }

/* ─── TOOLTIP ─── */
#tt {
  position:fixed; background:rgba(5,12,22,.97); border:1px solid var(--borde2);
  border-radius:8px; padding:10px 13px; font-size:10px; pointer-events:none;
  z-index:9999; max-width:290px; line-height:1.7;
  box-shadow:0 6px 24px rgba(0,0,0,.6); display:none;
}
#tt .tt-t { font-weight:800; font-size:12px; color:#fff; margin-bottom:5px; padding-bottom:5px; border-bottom:1px solid var(--borde2); }
#tt .tt-r { display:flex; gap:6px; }
#tt .tt-k { color:var(--txt3); min-width:85px; flex-shrink:0; }
#tt .tt-v { color:var(--txt); font-weight:600; }

/* ─── EMPTY STATE ─── */
.empty { text-align:center; padding:60px 20px; color:var(--txt3); }
.empty .eico { font-size:40px; margin-bottom:12px; }
.empty p { font-size:13px; }

/* ─── NOTA AVISO ─── */
.aviso { background:rgba(200,144,16,.08); border:1px solid rgba(200,144,16,.2); border-radius:5px; padding:6px 12px; font-size:9px; color:var(--amarillo2); display:flex; gap:6px; align-items:center; }

@media(max-width:600px) {
  header { flex-wrap:wrap; }
  .hkpis { overflow-x:scroll; }
  main { padding:8px 10px; }
  .prov-grid, .obras-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<header>
  <div class="hbrand">
    <span class="hbrand-ico">🛣️</span>
    <div>
      <h1>Red Vial Nacional</h1>
      <p>DIRECCIÓN NACIONAL DE VIALIDAD — Fuente: RED TOTAL · Junio 2026</p>
    </div>
  </div>
  <div class="hkpis">
    <div class="hkpi total"><span class="v" id="s-total">40.332 km</span><span class="l">Total red</span></div>
    <div class="hkpi conc"><span class="v" id="s-conc">—</span><span class="l">Concesionado</span></div>
    <div class="hkpi admin"><span class="v" id="s-admin">—</span><span class="l">Mant. Administración</span></div>
    <div class="hkpi conv"><span class="v" id="s-conv">—</span><span class="l">Conv. Provincias</span></div>
    <div class="hkpi obras"><span class="v" id="s-obras">—</span><span class="l">Obras activas</span></div>
    <div class="hkpi provs"><span class="v" id="s-provs">—</span><span class="l">Rutas</span></div>
  </div>
</header>

<div class="ctrl-bar">
  <div class="tabs">
    <button class="tab on" onclick="setVista('rutas')">Por Ruta</button>
    <button class="tab" onclick="setVista('provincias')">Por Provincia</button>
    <button class="tab" onclick="setVista('obras')">Obras (201)</button>
  </div>
  <div class="sep"></div>
  <div class="ctrl-group"><label>Ruta</label><select id="f-ruta"><option value="">Todas</option></select></div>
  <div class="ctrl-group"><label>Provincia</label><select id="f-prov"><option value="">Todas</option></select></div>
  <div class="ctrl-group"><label>Tipo gestión</label>
    <select id="f-tipo">
      <option value="">Todos</option>
      <option value="CONCESIÓN">Concesionado</option>
      <option value="NO CONCESIONADO">Mant. Administración</option>
      <option value="OTROS">Convenios Prov.</option>
    </select>
  </div>
  <div class="ctrl-group"><label>Estado obra</label>
    <select id="f-ob-estado">
      <option value="">Todos</option>
      <option value="EJECUCION">En ejecución</option>
      <option value="PARALIZADA">Paralizada</option>
      <option value="A LIMITAR">A limitar</option>
      <option value="FINALIZADA">Finalizada</option>
      <option value="RESCINDIDA">Rescindida</option>
      <option value="PROYECTADA">Proyectada</option>
    </select>
  </div>
  <div class="ctrl-group"><label>🔍</label><input type="text" id="f-bus" placeholder="buscar…" style="width:120px"></div>
  <button class="btn" onclick="toggleAll()" id="btn-tog">Colapsar todo</button>
  <div class="sep"></div>
  <div class="leyenda">
    <div class="ley"><div class="ley-sq" style="background:linear-gradient(var(--azul2),var(--azul))"></div>Concesionado</div>
    <div class="ley"><div class="ley-sq" style="background:linear-gradient(var(--verde2),var(--verde))"></div>Mant. Admin.</div>
    <div class="ley"><div class="ley-sq" style="background:linear-gradient(var(--lila2),var(--lila))"></div>Conv. Prov.</div>
    <div class="ley"><div class="ley-sq" style="background:linear-gradient(var(--naranja2),var(--naranja))"></div>RABA/Transf.</div>
    <div class="ley"><div class="ley-gap"></div>Gap sin datos</div>
    <div class="ley"><div class="ley-sq" style="background:var(--verde2);border-radius:50%"></div>Obra activa</div>
    <div class="ley"><div class="ley-sq" style="background:var(--amarillo2);border-radius:50%"></div>Paralizada</div>
  </div>
</div>

<div id="tt"></div>

<main id="main">
  <div id="v-rutas" style="display:flex;flex-direction:column;gap:10px"></div>
  <div id="v-prov" style="display:none"></div>
  <div id="v-obras" style="display:none"></div>

function estadoClass(e) {
  if (!e) return 'otras';
  e = e.toUpperCase();
  if (e === 'EJECUCION') return 'ejec';
  if (e === 'FINALIZADA') return 'final';
  if (e === 'PARALIZADA' || e === 'A LIMITAR') return 'paral';
  if (e.includes('RESCIND') || e.includes('RESCI')) return 'resc';
  if (e === 'PROYECTADA' || e === 'A INICIAR' || e === 'A REINICIAR' || e === 'LICITACIÓN') return 'proye';
  return 'otras';
}
function tipoClass(t, tramo) {
  if (t === 'CONCESIÓN') return 'conc';
  if (t === 'NO CONCESIONADO') return 'admin';
  if (tramo && (tramo.includes('RABA') || tramo.includes('TRANSF'))) return 'transf';
  return 'conv';
}
function tipoLabel(t) {
  if (t === 'CONCESIÓN') return 'Concesionado';
  if (t === 'NO CONCESIONADO') return 'Mant. Administración';
  return 'Convenio Prov.';
}
function fmt(n, dec=0) {
  if (n===''||n===null||n===undefined||n!==n) return '—';
  return Number(n).toLocaleString('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function fmtPct(n) {
  if (!n && n!==0) return '—';
  const v = parseFloat(n);
  if (isNaN(v)) return String(n);
  return v.toFixed(1)+'%';
}

// ─── ESTADO ───
let vista = 'rutas', allOpen = true;

// ─── INIT ───
function init() {
  const rutas = [...new Set(DATA.map(r=>String(r.Ruta)))].sort((a,b)=>isNaN(a)||isNaN(b)?a.localeCompare(b):+a-+b);
  const provs = [...new Set(DATA.map(r=>r.Provincia).filter(Boolean))].sort();
  const sel = id => document.getElementById(id);

  rutas.forEach(r => {
    const o = document.createElement('option');
    o.value=r; o.text=`RN ${r}`; sel('f-ruta').appendChild(o);
  });
  provs.forEach(p => {
    const o = document.createElement('option');
    o.value=p; o.text=p; sel('f-prov').appendChild(o);
  });

  ['f-ruta','f-prov','f-tipo','f-ob-estado'].forEach(id => sel(id).addEventListener('change', render));
  sel('f-bus').addEventListener('input', render);
  render();
}

function getFilters() {
  const g = id => document.getElementById(id).value;
  return { ruta:g('f-ruta'), prov:g('f-prov'), tipo:g('f-tipo'), obEst:g('f-ob-estado'), bus:g('f-bus').toLowerCase().trim() };
}

function filterRows(f) {
  return DATA.filter(r => {
    if (f.ruta && String(r.Ruta)!==f.ruta) return false;
    if (f.prov && r.Provincia!==f.prov) return false;
    if (f.tipo && r.TIPO!==f.tipo) return false;
    if (f.bus) {
      const hay=[r.Ruta,r.Distrito,r.Provincia,r.Tramo_Conc,r.Sistema,r.Prog_ini,r.Prog_fin].join(' ').toLowerCase();
      if(!hay.includes(f.bus)) return false;
    }
    return true;
  });
}

function filterObras(f) {
  return OBRAS.filter(o => {
    if (f.ruta && String(o.RUTA)!==f.ruta) return false;
    if (f.prov && o.PROVINCIA!==f.prov) return false;
    if (f.obEst && (o.ESTADO||'').toUpperCase()!==f.obEst) return false;
    if (f.bus) {
      const hay=[o.RUTA,o.DISTRITO,o.PROVINCIA,o.OBRA,o.TRAMO,o.ESTADO,o.CONTRATISTA].join(' ').toLowerCase();
      if(!hay.includes(f.bus)) return false;
    }
    return true;
  });
}

function setVista(v) {
  vista = v;
  document.querySelectorAll('.tab').forEach((b,i) => b.classList.toggle('on', ['rutas','provincias','obras'][i]===v));
  document.getElementById('v-rutas').style.display = v==='rutas' ? 'flex' : 'none';
  document.getElementById('v-prov').style.display = v==='provincias' ? 'block' : 'none';
  document.getElementById('v-obras').style.display = v==='obras' ? 'block' : 'none';
  render();
}

function render() {
  const f = getFilters();
  const rows = filterRows(f);
  const obras = filterObras(f);

  // Actualizar KPIs
  const km = rows.reduce((s,r)=>s+(+r.Longitud||0),0);
  const kmC = rows.filter(r=>r.TIPO==='CONCESIÓN').reduce((s,r)=>s+(+r.Longitud||0),0);
  const kmA = rows.filter(r=>r.TIPO==='NO CONCESIONADO').reduce((s,r)=>s+(+r.Longitud||0),0);
  const kmO = rows.filter(r=>r.TIPO==='OTROS').reduce((s,r)=>s+(+r.Longitud||0),0);
  const obrAct = obras.filter(o=>['EJECUCION','A INICIAR','A REINICIAR','LICITACIÓN'].includes((o.ESTADO||'').toUpperCase()));
  document.getElementById('s-total').textContent = fmt(km)+' km';
  document.getElementById('s-conc').textContent = fmt(kmC)+' km';
  document.getElementById('s-admin').textContent = fmt(kmA)+' km';
  document.getElementById('s-conv').textContent = fmt(kmO)+' km';
  document.getElementById('s-obras').textContent = obrAct.length+' activas';
  document.getElementById('s-provs').textContent = new Set(rows.map(r=>String(r.Ruta))).size+' rutas';

  if (vista==='rutas') renderRutas(rows, obras);
  else if (vista==='provincias') renderProvincias(rows, obras);
  else renderObras(obras);
}

// ─── VISTA RUTAS ───
function renderRutas(rows, obras) {
  const cont = document.getElementById('v-rutas');
  if (!rows.length) { cont.innerHTML='<div class="empty"><div class="eico">🔍</div><p>Sin resultados para los filtros seleccionados.</p></div>'; return; }

  // Agrupar
  const porRuta = {};
  rows.forEach(r => { if(!porRuta[r.Ruta]) porRuta[r.Ruta]=[]; porRuta[r.Ruta].push(r); });
  const obrasPorRuta = {};
  obras.forEach(o => { if(!obrasPorRuta[o.RUTA]) obrasPorRuta[o.RUTA]=[]; obrasPorRuta[o.RUTA].push(o); });

  const rutasOrd = Object.keys(porRuta).sort((a,b)=>isNaN(a)||isNaN(b)?a.localeCompare(b):+a-+b);

  // Detectar gaps
  const issues = [];
  rutasOrd.forEach(ruta => {
    const segs = [...porRuta[ruta]].sort((a,b)=>a.Prog_ini-b.Prog_ini);
    for(let i=0;i<segs.length-1;i++){
      const g = segs[i+1].Prog_ini - segs[i].Prog_fin;
      if(g < -0.15) issues.push({tipo:'⚡SUPERP.',ruta,km:Math.abs(g),fin:segs[i].Prog_fin,ini:segs[i+1].Prog_ini});
      else if(g > 0.5) issues.push({tipo:'GAP',ruta,km:g,fin:segs[i].Prog_fin,ini:segs[i+1].Prog_ini});
    }
  });

  let html = '';

  // Aviso gaps
  if(issues.length){
    html+=`<div class="aviso">⚠️ ${issues.length} diferencias detectadas en RED TOTAL: `;
    html+=issues.slice(0,5).map(i=>`RN ${i.ruta} ${i.tipo} km${fmt(i.fin,1)}→${fmt(i.ini,1)} (${fmt(i.km,1)}km)`).join(' · ');
    if(issues.length>5) html+=` y ${issues.length-5} más…`;
    html+=`</div>`;
  }

  rutasOrd.forEach(ruta => {
    const segs = [...porRuta[ruta]].sort((a,b)=>a.Prog_ini-b.Prog_ini);
    const kmR = segs.reduce((s,r)=>s+(+r.Longitud||0),0);
    const kmRC = segs.filter(r=>r.TIPO==='CONCESIÓN').reduce((s,r)=>s+(+r.Longitud||0),0);
    const kmRA = segs.filter(r=>r.TIPO==='NO CONCESIONADO').reduce((s,r)=>s+(+r.Longitud||0),0);
    const kmRO = segs.filter(r=>r.TIPO==='OTROS').reduce((s,r)=>s+(+r.Longitud||0),0);
    const kmIni = segs[0].Prog_ini, kmFin = segs[segs.length-1].Prog_fin;
    const span = (kmFin - kmIni) || 1;
    const provs = [...new Set(segs.map(r=>r.Provincia))];
    const obRuta = obrasPorRuta[ruta] || [];
    const pid = `p_${ruta.replace(/[^a-z0-9]/gi,'_')}`;
    const rutaIss = issues.filter(i=>i.ruta===ruta);

    // Chips provincia
    const provChips = provs.map(p=>`<span class="ptag" style="background:${PROV_COL[p]||'#506070'}33;border:1px solid ${PROV_COL[p]||'#506070'}66">${p}</span>`).join('');

    // Obras badge
    const obrasBadge = obRuta.length ? obRuta.slice(0,6).map(o=>{
      const ec = estadoClass(o.ESTADO);
      const estado = (o.ESTADO||'?').charAt(0).toUpperCase()+(o.ESTADO||'').slice(1).toLowerCase();
      const nombre = (o.OBRA||'Obra').substring(0,30);
      return `<span class="ob-badge ${ec}" onclick="event.stopPropagation()" data-ott="${JSON.stringify({nm:o.OBRA,rt:o.RUTA,pr:o.PROVINCIA,tr:o.TRAMO,es:o.ESTADO,av:o.AVANCE,tp:o['TIPO DE OBRA'],km:o.KM_OB,ct:o.CONTRATISTA}).replace(/"/g,'&quot;')}" onmouseenter="showTTObra(event,this)" onmouseleave="hideTT()" onmousemove="moveTT(event)"><span class="dot"></span>${nombre}${obRuta.length>6?'':`<span style="opacity:.5;font-size:8px"> · ${fmt(o.KM_OB,1)}km</span>`}</span>`;
    }).join('') : '';

    html+=`<div class="rp" id="${pid}">
    <div class="rp-head" onclick="togglePanel('${pid}')">
      <div><div class="rp-tag">Ruta Nacional</div><div class="rp-num">RN ${ruta}</div></div>
      <div><div class="rp-tag">Total relevado</div><div class="rp-km">${fmt(kmR)} km</div></div>
      <div class="rp-stats">
        ${kmRC>0?`<div class="rst"><span class="v" style="color:var(--azul3)">${fmt(kmRC)} km</span><span class="l">Concesionado</span></div>`:''}
        ${kmRA>0?`<div class="rst"><span class="v" style="color:var(--verde3)">${fmt(kmRA)} km</span><span class="l">Mant. Admin.</span></div>`:''}
        ${kmRO>0?`<div class="rst"><span class="v" style="color:var(--lila3)">${fmt(kmRO)} km</span><span class="l">Conv. Prov.</span></div>`:''}
        ${obRuta.length?`<div class="rst"><span class="v" style="color:var(--amarillo2)">${obRuta.length} obra${obRuta.length>1?'s':''}</span><span class="l">en ruta</span></div>`:''}
        ${rutaIss.length?`<div class="rst"><span class="v" style="color:var(--rojo2)">⚠️ ${rutaIss.length}</span><span class="l">gaps</span></div>`:''}
        <div class="rst"><span class="v" style="opacity:.5">km ${fmt(kmIni,1)}–${fmt(kmFin,1)}</span><span class="l">${segs.length} tramos</span></div>
      </div>
      <div class="prov-tags">${provChips}</div>
      <span class="chev" id="chev-${pid}">▼</span>
    </div>
    <div class="rp-body" id="body-${pid}">`;

    // Barra provincias
    html+=`<div class="bar-prov">`;
    segs.forEach(seg=>{
      const l=((seg.Prog_ini-kmIni)/span*100).toFixed(4);
      const w=(seg.Longitud/span*100).toFixed(4);
      const col=PROV_COL[seg.Provincia]||'#506070';
      html+=`<div class="bp-seg" style="left:${l}%;width:${w}%;background:${col}cc">${parseFloat(w)>4?`<span>${seg.Provincia}</span>`:''}</div>`;
    });
    html+=`</div>`;

    // Barra principal
    html+=`<div class="bar-wrap">
    <div class="bar-main">`;

    // Ticks
    const ts = span>2000?500:span>800?200:span>300?100:span>120?50:25;
    for(let t=Math.ceil(kmIni/ts)*ts;t<kmFin;t+=ts){
      const p=((t-kmIni)/span*100).toFixed(2);
      html+=`<div class="tick" style="left:${p}%"><span class="tick-l">km ${t}</span></div>`;
    }

    // Segmentos
    segs.forEach(seg=>{
      const l=((seg.Prog_ini-kmIni)/span*100).toFixed(4);
      const w=Math.max(seg.Longitud/span*100,0.15).toFixed(4);
      const cls=tipoClass(seg.TIPO,seg.Tramo_Conc);
      const td=JSON.stringify({id:seg.ID,t:seg.TIPO,r:seg.Ruta,p:seg.Provincia,d:seg.Distrito,i:seg.Prog_ini,f:seg.Prog_fin,l:seg.Longitud,tc:seg.Tramo_Conc,s:seg.Sistema,tm:seg.TMDA}).replace(/"/g,'&quot;');
      html+=`<div class="seg ${cls}" style="left:${l}%;width:${w}%;min-width:2px" data-tt="${td}" onmouseenter="showTTSeg(event,this)" onmouseleave="hideTT()" onmousemove="moveTT(event)"></div>`;
    });

    // Pins de obras (si km de obra está en el rango de la ruta)
    obRuta.forEach(o => {
      if (!o.KM_OB || !parseFloat(o.KM_OB)) return;
      // Buscar el segmento que contiene ese km
      const km_o = parseFloat(o.KM_OB);
      if (km_o < kmIni || km_o > kmFin) return;
      const l = ((km_o - kmIni) / span * 100).toFixed(4);
      const ec = estadoClass(o.ESTADO);
      const td = JSON.stringify({nm:o.OBRA,rt:o.RUTA,pr:o.PROVINCIA,tr:o.TRAMO,es:o.ESTADO,av:o.AVANCE,tp:o['TIPO DE OBRA'],km:o.KM_OB,ct:o.CONTRATISTA}).replace(/"/g,'&quot;');
      html+=`<div class="obra-pin ${ec}" style="left:${l}%" data-ott="${td}" onmouseenter="showTTObra(event,this)" onmouseleave="hideTT()" onmousemove="moveTT(event)"></div>`;
    });

    // Gaps
    rutaIss.forEach(iss=>{
      const l=((iss.fin-kmIni)/span*100).toFixed(4);
      const w=Math.max(iss.km/span*100,0.3).toFixed(4);
      const mid=(parseFloat(l)+parseFloat(w)/2).toFixed(2);
      html+=`<div class="gap-bar" style="left:${l}%;width:${w}%"></div>`;
      html+=`<div class="gap-lbl" style="left:${mid}%">⚠️ ${fmt(iss.km,1)}km</div>`;
    });

    html+=`</div>
    <div class="bar-lbl-row"><span>km ${fmt(kmIni,2)}</span><span>km ${fmt(kmFin,2)}</span></div>
    </div>`;

    // Leyenda prov
    if(provs.length>1){
      html+=`<div class="pleg-row">${provs.map(p=>`<div class="pleg-i"><div class="pleg-dot" style="background:${PROV_COL[p]||'#506070'}"></div>${p}</div>`).join('')}</div>`;
    }

    // Obras mini
    if(obrasBadge) html+=`<div class="obras-mini">${obrasBadge}${obRuta.length>6?`<span style="font-size:9px;color:var(--txt3);align-self:center">+${obRuta.length-6} más</span>`:''}</div>`;

    // Tabla detalle colapsable
    html+=`<div class="tbl-tog" onclick="togTbl('tbl-${pid}',this)">▶ Ver detalle de segmentos (${segs.length})</div>
    <div class="tbl-wrap" id="tbl-${pid}" style="display:none">
    <table class="tbl"><thead><tr>
      <th>ID</th><th>Tipo</th><th>Provincia</th><th>Distrito DNV</th>
      <th>Km Inicio</th><th>Km Fin</th><th>Longitud</th>
      <th>Tramo Concesión</th><th>Sistema/Malla</th><th>TMDA</th>
    </tr></thead><tbody>`;
    segs.forEach(seg=>{
      const cls=tipoClass(seg.TIPO,seg.Tramo_Conc);
      html+=`<tr class="${cls}"><td>${seg.ID}</td><td><span class="chip ${cls}">${tipoLabel(seg.TIPO)}</span></td>
      <td><strong>${seg.Provincia}</strong></td><td>${seg.Distrito}</td>
      <td>${fmt(seg.Prog_ini,2)}</td><td>${fmt(seg.Prog_fin,2)}</td><td><strong>${fmt(seg.Longitud,2)} km</strong></td>
      <td>${seg.Tramo_Conc||'—'}</td><td>${seg.Sistema||'—'}</td><td>${seg.TMDA||'—'}</td></tr>`;
    });
    html+=`</tbody></table></div>`;

    html+=`</div></div>`; // body + panel
  });

  cont.innerHTML = html;
}

// ─── VISTA PROVINCIAS ───
function renderProvincias(rows, obras) {
  const cont = document.getElementById('v-prov');
  if(!rows.length){cont.innerHTML='<div class="empty"><div class="eico">🗺️</div><p>Sin resultados.</p></div>';return;}

  const pp = {};
  rows.forEach(r=>{if(!pp[r.Provincia])pp[r.Provincia]=[];pp[r.Provincia].push(r);});
  const opp = {};
  obras.forEach(o=>{if(!opp[o.PROVINCIA])opp[o.PROVINCIA]=[];opp[o.PROVINCIA].push(o);});

  const maxKm = Math.max(...Object.values(pp).map(s=>s.reduce((a,r)=>a+(+r.Longitud||0),0)));

  const provOrd = Object.keys(pp).sort((a,b)=>{
    const ka=pp[a].reduce((s,r)=>s+(+r.Longitud||0),0);
    const kb=pp[b].reduce((s,r)=>s+(+r.Longitud||0),0);
    return kb-ka;
  });

  let html = '<div class="prov-grid">';
  provOrd.forEach(prov=>{
    const segs=pp[prov];
    const obp=opp[prov]||[];
    const km=segs.reduce((s,r)=>s+(+r.Longitud||0),0);
    const kmC=segs.filter(r=>r.TIPO==='CONCESIÓN').reduce((s,r)=>s+(+r.Longitud||0),0);
    const kmA=segs.filter(r=>r.TIPO==='NO CONCESIONADO').reduce((s,r)=>s+(+r.Longitud||0),0);
    const kmO=segs.filter(r=>r.TIPO==='OTROS').reduce((s,r)=>s+(+r.Longitud||0),0);
    const rutas=[...new Set(segs.map(r=>String(r.Ruta)))].sort((a,b)=>isNaN(a)||isNaN(b)?a.localeCompare(b):+a-+b);
    const col=PROV_COL[prov]||'#506070';
    const obAct=obp.filter(o=>['EJECUCION','A INICIAR','LICITACIÓN'].includes((o.ESTADO||'').toUpperCase())).length;

    html+=`<div class="prov-card" style="border-top:3px solid ${col}">
    <div class="prov-card-head">
      <div class="prov-dot" style="background:${col}"></div>
      <h3>${prov}</h3>
      <div><div style="font-size:8px;color:var(--txt2)">Total</div><div class="pkm" style="color:${col}">${fmt(km)} km</div></div>
    </div>
    <div class="prov-bars">`;

    [[kmC,'Concesionado','var(--azul)'],[kmA,'Mant. Admin.','var(--verde)'],[kmO,'Conv. Prov.','var(--lila)']].filter(b=>b[0]>0).forEach(([v,l,c])=>{
      const bw=(v/maxKm*100).toFixed(1);
      const pct=km>0?(v/km*100).toFixed(1):0;
      html+=`<div class="pb-row"><div class="pb-lbl">${l}</div>
      <div class="pb-track"><div class="pb-fill" style="width:${bw}%;background:${c}"></div></div>
      <div class="pb-val" style="color:${c}">${fmt(v)} km <span style="color:var(--txt3);font-weight:400">${pct}%</span></div></div>`;
    });

    html+=`</div>`;
    if(obp.length) html+=`<div class="prov-obras"><p>🏗️ ${obp.length} obra${obp.length>1?'s':''} · ${obAct} activa${obAct!==1?'s':''}</p>
      <div style="display:flex;gap:4px;flex-wrap:wrap">${obp.slice(0,4).map(o=>`<span class="ob-badge ${estadoClass(o.ESTADO)}" data-ott="${JSON.stringify({nm:o.OBRA,rt:o.RUTA,pr:o.PROVINCIA,tr:o.TRAMO,es:o.ESTADO,av:o.AVANCE,tp:o['TIPO DE OBRA'],km:o.KM_OB,ct:o.CONTRATISTA}).replace(/"/g,'&quot;')}" onmouseenter="showTTObra(event,this)" onmouseleave="hideTT()" onmousemove="moveTT(event)"><span class="dot"></span>${(o.OBRA||'?').substring(0,25)}</span>`).join('')}${obp.length>4?`<span style="font-size:9px;color:var(--txt3);align-self:center">+${obp.length-4}</span>`:''}</div></div>`;

    html+=`<div class="prov-rn">${rutas.map(r=>`<span class="rn-chip">RN ${r}</span>`).join('')}</div></div>`;
  });
  html+='</div>';
  cont.innerHTML=html;
}

// ─── VISTA OBRAS ───
function renderObras(obras) {
  const cont = document.getElementById('v-obras');
  if(!obras.length){cont.innerHTML='<div class="empty"><div class="eico">🏗️</div><p>Sin obras para los filtros seleccionados.</p></div>';return;}

  // Agrupar por estado
  const grupos = {'EJECUCION':'En Ejecución','A INICIAR':'A Iniciar','A REINICIAR':'A Reiniciar','LICITACIÓN':'En Licitación','PARALIZADA':'Paralizadas','A LIMITAR':'A Limitar','A RESCINDIR':'A Rescindir','NEUTRALIZADA':'Neutralizadas','RESCINDIDA':'Rescindidas','PROYECTADA':'Proyectadas','FINALIZADA':'Finalizadas','DESCARTADA':'Descartadas','SIN INICIO':'Sin Inicio'};
  const orden = ['EJECUCION','A INICIAR','A REINICIAR','LICITACIÓN','PARALIZADA','A LIMITAR','A RESCINDIR','NEUTRALIZADA','PROYECTADA','RESCINDIDA','FINALIZADA','DESCARTADA','SIN INICIO'];

  const porEst = {};
  obras.forEach(o=>{const k=(o.ESTADO||'').toUpperCase();if(!porEst[k])porEst[k]=[];porEst[k].push(o);});

  let html = '';
  orden.filter(e=>porEst[e]&&porEst[e].length).forEach(estado=>{
    const obs = porEst[estado];
    const ec = estadoClass(estado);
    const col = ESTADO_COL[estado]||'#506070';
    html+=`<div style="margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--borde)">
      <div style="width:10px;height:10px;border-radius:50%;background:${col};flex-shrink:0"></div>
      <span style="font-size:12px;font-weight:800;color:#fff">${grupos[estado]||estado}</span>
      <span style="font-size:10px;color:var(--txt2)">${obs.length} obra${obs.length>1?'s':''}</span>
    </div>
    <div class="obras-grid">`;
    obs.forEach(o=>{
      const av=parseFloat(o.AVANCE)||0;
      const avCol = av>=80?'var(--verde2)':av>=40?'var(--amarillo2)':'var(--rojo2)';
      const km_ob = parseFloat(o.KM_OB)||0;
      html+=`<div class="obra-card">
      <div class="oc-head">
        <div class="oc-estado"><div class="oc-dot" style="background:${col}"></div><span class="oc-lbl" style="color:${col}">${estado}</span></div>
        <span class="oc-rn" style="margin-left:auto">RN ${o.RUTA}</span>
      </div>
      <div class="oc-nombre">${o.OBRA||'—'}</div>
      ${o.TRAMO?`<div class="oc-tramo">📍 ${o.TRAMO}${o.SECCIÓN?` · ${o.SECCIÓN}`:''}</div>`:''}
      <div style="display:flex;gap:10px;align-items:center">
        ${km_ob>0?`<div><div class="oc-km">${fmt(km_ob,1)} km</div><div class="oc-tipo">${o['TIPO DE OBRA']||'—'}</div></div>`:''}
        <div><div class="oc-km">${o.PROVINCIA||o.DISTRITO||'—'}</div><div class="oc-tipo">Provincia</div></div>
      </div>
      ${av>0?`<div class="oc-avance"><div class="oc-av-track"><div class="oc-av-fill" style="width:${Math.min(av,100)}%;background:${avCol}"></div></div><span class="oc-av-val" style="color:${avCol}">${fmtPct(av)}</span></div>`:''}
      ${o.CONTRATISTA?`<div class="oc-cont">🏢 ${o.CONTRATISTA.substring(0,50)}</div>`:''}
      </div>`;
    });
    html+=`</div></div>`;
  });

  cont.innerHTML=html;
}

// ─── PANEL TOGGLE ───
function togglePanel(pid) {
  const body=document.getElementById('body-'+pid);
  const chev=document.getElementById('chev-'+pid);
  body.classList.toggle('hdn');
  chev.classList.toggle('cl');
}
function togTbl(id,btn) {
  const el=document.getElementById(id);
  const vis=el.style.display!=='none';
  el.style.display=vis?'none':'block';
  btn.textContent=(vis?'▶':'▼')+btn.textContent.slice(1);
}
function toggleAll() {
  allOpen=!allOpen;
  document.querySelectorAll('.rp-body').forEach(b=>b.classList.toggle('hdn',!allOpen));
  document.querySelectorAll('.chev').forEach(c=>c.classList.toggle('cl',!allOpen));
  document.getElementById('btn-tog').textContent=allOpen?'Colapsar todo':'Expandir todo';
}

// ─── TOOLTIPS ───
const TT = document.getElementById('tt');
function showTTSeg(e,el){
  const d=JSON.parse(el.getAttribute('data-tt').replace(/&quot;/g,'"'));
  const cls=tipoClass(d.t,d.tc);
  const cols={conc:'var(--azul3)',admin:'var(--verde3)',conv:'var(--lila3)',transf:'var(--naranja3)'};
  TT.innerHTML=`<div class="tt-t">RN ${d.r} · km ${fmt(d.i,2)} → ${fmt(d.f,2)}</div>
    <span class="chip ${cls}" style="margin-bottom:5px;display:inline-block">${tipoLabel(d.t)}</span>
    <div class="tt-r"><span class="tt-k">Provincia</span><span class="tt-v" style="color:${PROV_COL[d.p]||'#ccc'}">${d.p}</span></div>
    <div class="tt-r"><span class="tt-k">Distrito DNV</span><span class="tt-v">${d.d}</span></div>
    <div class="tt-r"><span class="tt-k">Longitud</span><span class="tt-v" style="color:${cols[cls]||'#fff'}">${fmt(d.l,2)} km</span></div>
    ${d.tc?`<div class="tt-r"><span class="tt-k">Tramo conc.</span><span class="tt-v">${d.tc}</span></div>`:''}
    ${d.s?`<div class="tt-r"><span class="tt-k">Sistema/Malla</span><span class="tt-v">${d.s}</span></div>`:''}
    ${d.tm&&d.tm!=='nan'?`<div class="tt-r"><span class="tt-k">TMDA</span><span class="tt-v">${d.tm}</span></div>`:''}
    <div style="margin-top:4px;font-size:8px;color:var(--txt3)">ID #${d.id}</div>`;
  TT.style.display='block'; moveTT(e);
}
function showTTObra(e,el){
  const d=JSON.parse(el.getAttribute('data-ott').replace(/&quot;/g,'"'));
  const col=ESTADO_COL[(d.es||'').toUpperCase()]||'#7a9bbf';
  const av=parseFloat(d.av)||0;
  TT.innerHTML=`<div class="tt-t">🏗️ ${d.nm||'Obra sin nombre'}</div>
    <div class="tt-r"><span class="tt-k">Estado</span><span class="tt-v" style="color:${col};font-weight:700">${d.es||'—'}</span></div>
    <div class="tt-r"><span class="tt-k">Ruta</span><span class="tt-v">RN ${d.rt||'?'}</span></div>
    <div class="tt-r"><span class="tt-k">Provincia</span><span class="tt-v">${d.pr||'—'}</span></div>
    ${d.tr?`<div class="tt-r"><span class="tt-k">Tramo</span><span class="tt-v">${d.tr}</span></div>`:''}
    ${d.tp?`<div class="tt-r"><span class="tt-k">Tipo obra</span><span class="tt-v">${d.tp}</span></div>`:''}
    ${d.km>0?`<div class="tt-r"><span class="tt-k">KM</span><span class="tt-v">${fmt(d.km,1)} km</span></div>`:''}
    ${av>0?`<div class="tt-r"><span class="tt-k">Avance</span><span class="tt-v">${fmtPct(av)}</span></div>`:''}
    ${d.ct?`<div class="tt-r"><span class="tt-k">Contratista</span><span class="tt-v" style="max-width:180px;word-break:break-word">${d.ct}</span></div>`:''}`;
  TT.style.display='block'; moveTT(e);
}
function moveTT(e){
  let x=e.clientX+16,y=e.clientY-10;
  if(x+300>window.innerWidth)x=e.clientX-310;
  if(y+280>window.innerHeight)y=e.clientY-280;
  TT.style.left=x+'px'; TT.style.top=y+'px';
}
function hideTT(){TT.style.display='none';}

init();
</script>
</body>
